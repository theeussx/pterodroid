services:
  pterodroid:
    build:
      context: .
      dockerfile: Dockerfile
    image: pterodroid:latest
    container_name: pterodroid
    ports:
      - "${PTERODROID_PORT:-3001}:3001"

    volumes:
      # Um bind único com TUDO dentro (banco, workspaces dos serviços,
      # config do cloudflared). Fica visível no host, então dá pra fazer
      # backup copiando uma pasta só — antes os dados ficavam divididos
      # entre um volume nomeado e um bind, e o panel.db acabava escondido
      # dentro do volume.
      - ./data:/data
      # Necessário para o painel gerenciar containers no host.
      # Remova esta linha se você só vai rodar serviços como processo.
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Gere um segredo forte com:  openssl rand -hex 32
      # Sem definir, o painel cria um automaticamente em ./data/.jwt-secret.
      JWT_SECRET: "${JWT_SECRET:-}"
      # Quando o painel roda em container e pede ao Docker do host para
      # criar OUTRO container com bind mount, o daemon resolve o caminho no
      # filesystem DELE. Sem isto, o Docker criaria uma pasta vazia no host
      # e o container do serviço subiria sem os arquivos do projeto.
      HOST_WORKSPACES_ROOT: "${PWD}/data/workspaces"
      TZ: "${TZ:-America/Sao_Paulo}"

    # O socket do Docker pertence ao grupo `docker` do host. Entrar nesse
    # grupo é bem mais seguro do que rodar o container inteiro como root
    # (que era o que o compose fazia antes, anulando o usuário sem
    # privilégios criado no Dockerfile).
    # No ambiente atual o GID do grupo docker é 989; se seu host usar outro
    # valor, defina DOCKER_GID explicitamente antes de subir o compose.
    group_add:
      - "${DOCKER_GID:-989}"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Um painel pessoal com serviços verbosos enche o disco de log do Docker
    # em silêncio; o teto abaixo evita isso.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
